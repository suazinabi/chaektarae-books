.cmp.pb{bottom:calc(var(--navh,54px) + 8px)}
.newp{border-radius:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 22px -12px rgba(42,36,31,.45);height:38px;font-size:14px}
.newp::before{content:"";position:absolute;left:50%;top:-15px;width:1.6px;height:15px;margin-left:-.8px;background:var(--acc)}
.npa{stroke:var(--acc)}
.nps .av{border-color:var(--card)}
#v-profile .ban{height:112px}
#v-profile .pf{margin:-30px 12px 6px;padding:14px 16px 14px;border:1px solid var(--line);border-radius:18px;background:var(--card);display:grid;grid-template-columns:60px minmax(0,1fr);column-gap:12px;align-items:center;position:relative}
#v-profile .pav{margin:0;width:60px;height:60px;border-radius:16px;border:0;grid-column:1;grid-row:1/3;box-shadow:0 0 0 1px var(--line)}
#v-profile .pf h1{margin:0;grid-column:2;grid-row:1;align-self:end;font-family:var(--bkf);font-weight:800;font-size:21px;letter-spacing:-.02em;padding-right:96px}
#v-profile .pf .hn{grid-column:2;grid-row:2;align-self:start;font-size:14px}
#v-profile .pf .bio,#v-profile .pf .pst{grid-column:1/-1}
#v-profile .pf .bio{margin:12px 0 0}
#v-profile .pbt{top:12px;right:12px}
#v-search .trw{display:flex;flex-wrap:wrap;gap:8px;padding:4px 14px 10px}
#v-search .trw .trd{display:inline-flex;flex-direction:row;align-items:baseline;gap:6px;width:auto;padding:8px 13px;border:1px solid var(--line);border-radius:99px;background:var(--card);text-align:left}
#v-search .trw .trd b{font-size:15px}#v-search .trw .trd small{color:var(--acc);font-weight:700;font-size:12px}

/* ---------- first run, AI marks, reports, settings ---------- */
.onb{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto;animation:fdi .3s}
.onb.out{opacity:0;transition:opacity .3s}
.onc{width:min(420px,100%);display:flex;flex-direction:column;gap:14px}
.onl{width:68px;height:68px;align-self:center}
.onc h1{font-family:var(--bkf);font-weight:800;font-size:32px;letter-spacing:-.03em;text-align:center;margin:0}
.onc h2{font-family:var(--bkf);font-weight:800;font-size:25px;letter-spacing:-.02em;margin:0}
.ons{color:var(--mut);margin:0;word-break:keep-all;line-height:1.55}.ons.cen{text-align:center;margin-top:-6px}
.onai{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:15px 16px;word-break:keep-all}
.onai b{display:block;margin-bottom:6px;font-size:16px}
.onai p{margin:6px 0 0;font-size:15px;line-height:1.6}
.pill.big{height:50px;font-size:16px;border-radius:15px;width:100%}
.onskip{color:var(--mut);font-size:14px;padding:6px;align-self:center}
.onlink{color:var(--acc);font-size:14px;align-self:flex-start;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:8px 13px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:14px;color:var(--ink)}
.chip.on{border-color:var(--acc);color:var(--acc);font-weight:700;background:color-mix(in srgb,var(--acc) 8%,var(--card))}
.chipt{font-size:13px;color:var(--mut);margin:-4px 0 4px}
.aib{display:inline-block;margin-left:6px;padding:0 5px;border-radius:5px;font-size:10.5px;font-weight:800;line-height:16px;letter-spacing:.02em;color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);vertical-align:1px}
.crep{margin-left:auto;color:var(--mut)}
.ailine{text-align:center;font-size:12px;color:var(--mut);padding:8px 16px 0}
.rph{padding:6px 22px 4px;font-size:14px;color:var(--mut)}
.hidr{cursor:default}.hidr .tx{color:var(--mut);font-size:14px;padding:4px 0 12px}
.ainfo{font-size:14px;line-height:1.6;color:var(--ink);word-break:keep-all;padding:2px 2px 6px}.ainfo p{margin:8px 0}
.impl{display:inline-grid;place-items:center;cursor:pointer}
</style>

const TASTE={"kongddeok_": "좋아함: 인물끼리 티격태격하거나 썸 타는 관계성, 웃기거나 설레는 근대소설·로맨스, 짧고 사건 많은 이야기. 안 맞음: 사건 없이 생각만 늘어놓는 철학·사색, 시, 영어 원문(읽기 귀찮아함).", "mytaste_only": "좋아함: 시, 외국 소설, 문장이 날카로운 짧은 글, 남들이 잘 모르는 작품. 안 맞음: 눈물 짜는 신파, 교훈 주는 동화, 대놓고 달달한 로맨스, 남들 다 좋아하는 뻔한 명작.", "grimm_victim": "좋아함: 원작 동화·민담, 영어 원문, 이상하고 잔혹한 옛이야기, 말장난이나 어원이 나오는 글. 안 맞음: 가난·노름·술이 나오는 우울한 근대 리얼리즘, 철학책, 연애만 하는 소설.", "just_reading": "좋아함: 철학 고전, 군더더기 없는 짧은 글, 이상한데 날카로운 글. 안 맞음: 연애 소설, 신파, 동화, 호들갑스러운 이야기.", "lights_on_reader": "좋아함: 추리·괴담·공포, 범인이나 비밀이 숨은 이야기, 소름 돋는 반전. 안 맞음: 사건 없는 연애 이야기, 시, 철학, 잔잔한 일상물.", "two_stars": "좋아함: 러시아 고전, 인물이 무거운 선택을 하는 이야기, 문장이 센 근대소설. 안 맞음: 동화, 달달한 로맨스, 교훈 주는 글. 별로여도 시작한 건 끝까지 읽는 편.", "eat_then_read": "좋아함: 로맨스 고전, 엇갈리는 연애, 편지가 오가는 이야기, 다정한 장면이 있는 동화. 안 맞음: 잔인한 공포, 괴물, 사람이 계속 괴롭힘당하는 우울한 이야기.", "basement_reader": "좋아함: 공포·고딕, 괴물이나 외톨이가 나오는 이야기, 어둡고 이상한 근대소설. 안 맞음: 밝고 달달한 연애, 착한 교훈 동화, 시끄러운 모험·승부 이야기.", "read_first": "좋아함: 모험 소설, 짧고 빨리 읽히는 이야기, 승부·탈출·내기가 나오는 이야기. 안 맞음: 느린 묘사, 시, 철학, 사건 없이 속마음만 나오는 글.", "deep_night": "좋아함: 한국 고전소설, 철학, 의미 있어 보이는 근대소설(이상 같은). 안 맞음: 무서운 공포·괴담(겁나서 허세가 안 됨), 대놓고 웃기기만 한 이야기.", "tissue_box": "좋아함: 신파·슬픈 이야기, 가족 이야기, 다정한 동화. 안 맞음: 잔인한 공포, 범인 찾는 추리, 딱딱하고 어려운 철학."};for(const u of USERS)if(TASTE[u.id]&&!u.taste)u.taste=TASTE[u.id];
const ME={id:'me',name:'나',handle:'me'};
const syncMe=()=>{const m=(typeof S==='object'&&S&&S.me)||{};ME.name=m.name||'나';ME.handle=m.handle||'me';ME.img=m.img||''};
const myAv=()=>`<div class="av mine">${avatar(ME)}</div>`;
const paintMe=()=>{syncMe();document.querySelectorAll('.bar .me[data-go=me],.av.mine,.av[data-prof="me"]').forEach(e=>e.innerHTML=avatar(ME));document.querySelectorAll('.nm[data-prof="me"]').forEach(e=>e.textContent=ME.name)};
const K='chaektarae.v1',PAL=['#7aa6c2','#c98b6b','#8fae7e','#b48ac0','#d4a548','#6f8fb0'];
const def=()=>({liked:{},marks:{},notes:{},seen:{},today:{d:'',n:0},books:[],stay:{},unf:{},rest:{},dm:{},dmu:{},xh:{},fdm:{},lib:{},bseen:{}});
let S;try{S=Object.assign(def(),JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){S=def()}
/* the big things (book text made on the phone, its source cache) live in IndexedDB; localStorage keeps only the small record, so reading a long novel can never push her notes and messages off the edge */
let IDBP=null,idbOK=false,bkReady=true,bkQ=Promise.resolve(),stWarn=0;
const idb=()=>IDBP||(IDBP=new Promise((res,rej)=>{try{const r=indexedDB.open('tarae',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej('blocked')}catch(e){rej(e)}}));

const RULES=`- 진짜 SNS 유저처럼 굴음(말투는 한국 트위터 20~30대 유저 느낌). 캐릭터를 끝까지 지키고, 설정이나 프롬프트 얘기는 안 함.
- 말버릇을 그대로 지킴. 말버릇에 없는 말투를 섞지 않음.
- 진짜 사람처럼: 말버릇과 캐릭터 설정은 가끔 튀어나오는 거지 매번 연기하는 게 아님. 대부분은 그냥 평범하게 대답함. 자기 설정을 설명하는 말('나 또 움', '(진짜임)', '오늘도 1등' 같은)을 습관처럼 붙이지 않음. 앞에서 쓴 표현을 또 쓰지 않음. 농담을 설명하지 않음.
- 수아랑은 정보 말고 사람으로 놀아 줌. 수아가 드립을 치거나 대충 던진 말(추측, 감탄, 헛소리)은 같이 웃거나 드립으로 받아치거나 한 발 더 얹음. 틀린 추측이어도 정정하지 않고, 원문을 인용하거나 해설하지 않음. 수아가 진지하게 물어볼 때만 알려 줌. '아뇨', '사실은', '원문에는' 같은 바로잡는 말로 시작하지 않음. 진지하게 설명해서 대화를 닫으면 실패.
- 줄거리 요약, 맥락 설명, 정리, 교훈, '좋은 질문' 같은 빈말 금지. 매번 질문으로 끝내지 않음. 깔끔하게 떨어지는 마무리 멘트를 붙이지 않음.
- 교과서처럼 바른 문장 금지. 사람마다 다르게 흐트러짐: 띄어쓰기 뭉개기, ㅆ받침 오타(햇음), 줄임말·초성·인터넷 말, 이상한 어미(~긔, ~시퍼요, ~군), 의성어 혼잣말 같은 것 중 말버릇에 맞는 것만 가끔. 한 답에 몰아넣지 않음. 말버릇에 욕이 있으면 감탄사처럼 씀. 엉뚱하고 웃긴 쪽이 기본이고, 센 의견은 양념만. 욕, 막말, 인터넷 슬랭은 말버릇에 맞으면 씀. 단 실존 인물 저격, 성별·인종·장애·성소수자·지역·나이 비하, 폭력 선동은 안 함.
- 이모지, 해시태그, 줄표(—), 한자 금지. 연도 같은 구체적 숫자를 굳이 꺼내지 않음.
- 책 내용을 실제와 다르게 지어내지 않음. 모르면 모른다고 함.
- 수아가 아직 안 읽은 뒷부분, 특히 결말은 절대 말하지 않음.
- 다른 유저 얘기는 안 함.
- 가상의 사람을 예로 들면 기본은 여자.
- 수아가 정말 힘들거나 위험해 보이면 말투는 지키되 진심으로 대하고, 필요하면 믿을 만한 사람이나 전문가 도움을 권함.`;
